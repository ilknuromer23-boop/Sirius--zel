
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sirius'un Masal Parkı 🍭</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Trebuchet MS", sans-serif;
  overflow: hidden;
  color: #754d76;
}
.scene {
  display: none;
  min-height: 100vh;
  width: 100%;
  padding: 25px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  animation: appear .8s ease;
}
.scene.active { display: flex; }
@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
h1 {
  font-size: clamp(25px, 7vw, 38px);
  line-height: 1.4;
}
p { font-size: 18px; }
button {
  border: none;
  border-radius: 30px;
  padding: 15px 27px;
  margin-top: 22px;
  background: #fff;
  color: #a65c91;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 5px 15px #0002;
  cursor: pointer;
}
button:active { transform: scale(.95); }

/* PAMUK ŞEKERİ */
#scene1 {
  background: linear-gradient(145deg,#ffe0f0,#d9e8ff,#fff0d9);
}
.candy {
  position: relative;
  width: 220px;
  height: 240px;
  margin: 25px auto;
  cursor: pointer;
  animation: float 2s infinite ease-in-out;
}
.puff {
  position: absolute;
  width: 85px;
  height: 90px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ffb5df,#fff0fa);
  box-shadow: inset -8px -7px 15px #e98acb55;
}
.p1 { left: 30px; top: 35px; }
.p2 { left: 75px; top: 5px; background:linear-gradient(135deg,#b9d9ff,#f8dfff); }
.p3 { right: 25px; top: 35px; }
.p4 { left: 65px; top: 65px; background:linear-gradient(135deg,#ffc2e5,#d5c9ff); }
.p5 { left: 90px; top: 42px; background:linear-gradient(135deg,#fff0fa,#b9d9ff); }
.stick {
  position: absolute;
  width: 13px;
  height: 115px;
  background: #e7bd91;
  left: 105px;
  top: 112px;
  transform: rotate(-5deg);
  border-radius: 10px;
  z-index: -1;
}
@keyframes float {
  50% { transform: translateY(-12px) rotate(3deg); }
}

/* PARK */
#scene2 {
  background: linear-gradient(#bce8ff,#e4f8d9 70%,#a8d98c);
}
.park {
  font-size: clamp(65px, 18vw, 105px);
  margin: 25px 0;
  animation: float 3s infinite;
}
.flowers { font-size: 35px; }

/* SALINCAK */
#scene3 {
  background: linear-gradient(#d9caff,#ffe0f1 65%,#b9e5d2);
}
.swing {
  position: relative;
  width: 220px;
  height: 250px;
  margin: 20px auto;
}
.top {
  position: absolute;
  top: 12px;
  left: 15px;
  width: 190px;
  height: 12px;
  background: #956b50;
  border-radius: 20px;
}
.rope {
  position: absolute;
  top: 20px;
  width: 5px;
  height: 160px;
  background: #fff;
  transform-origin: top;
}
.r1 { left: 65px; transform: rotate(-8deg); }
.r2 { right: 65px; transform: rotate(8deg); }
.seat {
  position: absolute;
  top: 175px;
  left: 60px;
  width: 100px;
  height: 17px;
  background: #b77cba;
  border-radius: 15px;
  animation: swing 2s infinite ease-in-out;
}
@keyframes swing {
  0%,100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}
</style>
</head>
<body>

<section class="scene active" id="scene1">
  <h1>Sirius'um, pamuk şekerini al bakalım! 🍭</h1>
  <div class="candy" onclick="nextScene(2)">
    <div class="puff p1"></div>
    <div class="puff p2"></div>
    <div class="puff p3"></div>
    <div class="puff p4"></div>
    <div class="puff p5"></div>
    <div class="stick"></div>
  </div>
  <p>Senin için en tatlısını seçtim! 💗</p>
  <button onclick="nextScene(2)">Gitmek için tıkla →</button>
</section>

<script>
function nextScene(number) {
  document.querySelectorAll(".scene").forEach(scene => {
    scene.classList.remove("active");
  });
  document.getElementById("scene" + number).classList.add("active");
}
</script>
