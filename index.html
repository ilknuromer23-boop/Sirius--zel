
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sirius'un Gece Masalı 🌙</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #080d25;
  color: white;
  overflow: hidden;
}
.scene {
  display: none;
  width: 100%;
  height: 100vh;
  min-height: 550px;
  position: relative;
  overflow: hidden;
  text-align: center;
}
.scene.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: appear 1s ease;
}
@keyframes appear {
  from { opacity: 0; }
  to { opacity: 1; }
}
h1 {
  font-size: clamp(25px, 6vw, 38px);
  padding: 0 18px;
  text-shadow: 0 2px 15px #0009;
}
button {
  border: 1px solid #ffffff88;
  border-radius: 30px;
  padding: 14px 25px;
  color: white;
  background: #ffffff22;
  backdrop-filter: blur(8px);
  font-size: 17px;
  cursor: pointer;
  margin-top: 20px;
}
.candy-scene {
  background: radial-gradient(ellipse at center,#333052,#090b20 75%);
}
.candy-picture {
  width: min(78vw,390px);
  max-height: 53vh;
  object-fit: contain;
  filter: drop-shadow(0 0 25px #f4a5ff88);
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-13px); }
}
.park-scene {
  background-image:
    linear-gradient(#080d2540,#080d2566),
    url("park.jpg");
  background-size: cover;
  background-position: center;
}
.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 10% 20%,white 90%,transparent),
    radial-gradient(1px 1px at 30% 12%,white 90%,transparent),
    radial-gradient(2px 2px at 70% 17%,white 90%,transparent),
    radial-gradient(1px 1px at 85% 30%,white 90%,transparent),
    radial-gradient(2px 2px at 55% 8%,white 90%,transparent);
  background-size: 220px 180px;
  animation: twinkle 4s infinite alternate;
}
@keyframes twinkle {
  from { opacity: .35; }
  to { opacity: 1; }
}
.park-title {
  position: absolute;
  top: 25px;
  left: 0;
  right: 0;
  text-shadow: 0 2px 12px #000;
}
.park-hint {
  position: absolute;
  bottom: 25px;
  left: 10px;
  right: 10px;
  text-shadow: 0 2px 12px #000;
}
.swing-control {
  position: absolute;
  width: 22%;
  height: 30%;
  right: 8%;
  top: 37%;
  border: 2px dashed #ffffff00;
  cursor: pointer;
}
.swing-control.moving {
  animation: swing 1.7s ease-in-out infinite;
  transform-origin: 50% 0%;
}
@keyframes swing {
  0%,100% { transform: rotate(-9deg); }
  50% { transform: rotate(9deg); }
}
</style>
</head>
<body>

<section class="scene candy-scene active" id="first">
  <div class="stars"></div>
  <h1>Sirius'um, pamuk şekerini al bakalım! 💗</h1>
  <img class="candy-picture" src="pamuk-seker.png"
       alt="Pembe ve mavi gülen yüzlü pamuk şekeri">
  <p>Senin için en tatlısı...</p>
  <button onclick="showPark()">Gitmek için tıkla →</button>
</section>

<section class="scene park-scene" id="park">
  <div class="stars"></div>
  <h1 class="park-title">Yıldızların altında biraz gezelim 🌙</h1>

  <div class="swing-control" id="swing"
       role="button" tabindex="0"
       aria-label="Salıncağı başlat veya durdur"
       onclick="toggleSwing()"
       onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSwing()}">
  </div>

  <div class="park-hint">
    <p>Salıncağa dokun, sallansın! ✨</p>
    <button onclick="showCandy()">Baştan başla ↶</button>
  </div>
</section>

<script>
function showPark() {
  document.getElementById("first").classList.remove("active");
  document.getElementById("park").classList.add("active");
}
function showCandy() {
  document.getElementById("park").classList.remove("active");
  document.getElementById("first").classList.add("active");
  document.getElementById("swing").classList.remove("moving");
}
function toggleSwing() {
  document.getElementById("swing").classList.toggle("moving");
}
</script>
</body>
</html>
