
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sirius'un Masal Parkı 💜</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Trebuchet MS", sans-serif;
  overflow: hidden;
  color: #754d76;
}

.scene {
  display: none;
  min-height: 100vh;
  width: 100%;
  padding: 25px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.scene.active {
  display: flex;
  animation: appear .8s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  font-size: clamp(25px, 7vw, 38px);
  line-height: 1.4;
  z-index: 5;
}

p {
  font-size: 18px;
  z-index: 5;
}

button {
  border: none;
  border-radius: 30px;
  padding: 15px 27px;
  margin-top: 22px;
  background: white;
  color: #a65c91;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 5px 15px #0002;
  cursor: pointer;
  z-index: 5;
}

button:active {
  transform: scale(.95);
}

/* PAMUK ŞEKERİ */

#scene1 {
  background: linear-gradient(145deg,#d9c5ff,#c6d9ff,#ffe0f0);
}

.candy {
  position: relative;
  width: 220px;
  height: 240px;
  margin: 25px auto;
  animation: float 2s infinite ease-in-out;
  cursor: pointer;
}

.puff {
  position: absolute;
  width: 85px;
  height: 90px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ffb5df,#fff0fa);
  box-shadow: inset -8px -7px 15px #e98acb55;
}

.p1 { left: 30px; top: 35px; }
.p2 {
  left: 75px; top: 5px;
  background: linear-gradient(135deg,#b9d9ff,#f8dfff);
}
.p3 { right: 25px; top: 35px; }
.p4 {
  left: 65px; top: 65px;
  background: linear-gradient(135deg,#ffc2e5,#d5c9ff);
}
.p5 {
  left: 90px; top: 42px;
  background: linear-gradient(135deg,#fff0fa,#b9d9ff);
}

.stick {
  position: absolute;
  width: 13px;
  height: 115px;
  background: #e7bd91;
  left: 105px;
  top: 112px;
  transform: rotate(-5deg);
  border-radius: 10px;
  z-index: -1;
}

@keyframes float {
  50% { transform: translateY(-12px) rotate(3deg); }
}

/* MASAL PARKI */

#scene2 {
  background: linear-gradient(
    180deg,
    #171634 0%,
    #39305f 45%,
    #74608e 75%,
    #b89ac4 100%
  );
  color: white;
}

.moon {
  position: absolute;
  top: 90px;
  right: 45px;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #fff1c9;
  box-shadow: 0 0 25px #fff0bb, 0 0 65px #d8bfff;
}

.stars {
  position: absolute;
  top: 30px;
  left: 10px;
  width: 100%;
  color: #fff4ce;
  font-size: 19px;
  letter-spacing: 18px;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .4; }
  to { opacity: 1; }
}

.park-ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 43%;
  background: linear-gradient(#4e705f,#233e3e);
  border-radius: 50% 50% 0 0 / 12% 12% 0 0;
}

.path {
  position: absolute;
  bottom: -45px;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 230px;
  background: linear-gradient(90deg,#b49a9b,#ead0d0,#a98e9a);
  clip-path: polygon(35% 0,65% 0,100% 100%,0 100%);
  opacity: .9;
}

.tree {
  position: absolute;
  bottom: 28%;
  width: 105px;
  height: 190px;
  z-index: 2;
}

.tree-left {
  left: 2%;
  transform: scale(1.05);
}

.tree-right {
  right: 2%;
  transform: scale(1.1);
}

.trunk {
  position: absolute;
  bottom: 0;
  left: 43px;
  width: 20px;
  height: 105px;
  background: linear-gradient(90deg,#51352f,#93634b);
  border-radius: 10px;
}

.leaves {
  position: absolute;
  width: 105px;
  height: 110px;
  top: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%,#91a77e,#456b62 70%);
  box-shadow:
    -25px 20px 0 -8px #526f62,
    25px 25px 0 -5px #66836d;
}

.tree-right .leaves {
  background: radial-gradient(circle at 35% 30%,#a18bab,#52627b 75%);
  box-shadow:
    -25px 20px 0 -8px #596c77,
    25px 25px 0 -5px #6d708b;
}

.flower {
  position: absolute;
  bottom: 18%;
  font-size: 27px;
  z-index: 3;
}

.f1 { left: 12%; }
.f2 { left: 28%; bottom: 13%; }
.f3 { right: 15%; }
.f4 { right: 30%; bottom: 12%; }

.butterflies {
  position: absolute;
  top: 40%;
  left: 20%;
  font-size: 28px;
  animation: float 3s infinite ease-in-out;
  z-index: 3;
}

.park-caption {
  z-index: 5;
  margin-top: 220px;
  text-shadow: 0 2px 8px #17102f;
}

/* SALINCAK */

#scene3 {
  background: linear-gradient(
    180deg,
    #29204f,
    #8a70b5,
    #e7c8ed
  );
  color: white;
}

.swing {
  position: relative;
  width: 250px;
  height: 280px;
  margin: 20px auto;
}

.top {
  position: absolute;
  top: 12px;
  left: 15px;
  width: 220px;
  height: 13px;
  background: #76513e;
  border-radius: 20px;
}

.rope {
  position: absolute;
  top: 22px;
  width: 5px;
  height: 175px;
  background: #fff0dc;
  transform-origin: top;
}

.r1 { left: 75px; }
.r2 { right: 75px; }

.seat {
  position: absolute;
  top: 190px;
  left: 65px;
  width: 120px;
  height: 18px;
  background: #d9a0e5;
  border-radius: 15px;
  transform-origin: center top;
  animation: swing 2s infinite ease-in-out;
}

@keyframes swing {
  0%,100% { transform: rotate(-7deg); }
  50% { transform: rotate(7deg); }
}

</style>
</head>

<body>

<!-- 1. PAMUK ŞEKERİ -->

<section class="scene active" id="scene1">

  <h1>Sirius'um, pamuk şekerini al bakalım! 🍭</h1>

  <div class="candy" onclick="nextScene(2)">
    <div class="puff p1"></div>
    <div class="puff p2"></div>
    <div class="puff p3"></div>
    <div class="puff p4"></div>
    <div class="puff p5"></div>
    <div class="stick"></div>
  </div>

  <p>Senin için en tatlısını seçtim! 💗</p>

  <button onclick="nextScene(2)">
    Gitmek için tıkla →
  </button>

</section>


<!-- 2. MASAL PARKI -->

<section class="scene" id="scene2">

  <div class="stars">✦　⋆　✧　⋆　✦　⋆　✧</div>

  <div class="moon"></div>

  <h1>Şimdi biraz parkta gezelim! 🌷</h1>

  <div class="tree tree-left">
    <div class="leaves"></div>
    <div class="trunk"></div>
  </div>

  <div class="tree tree-right">
    <div class="leaves"></div>
    <div class="trunk"></div>
  </div>

  <div class="park-ground"></div>
  <div class="path"></div>

  <div class="butterflies">🦋</div>

  <div class="flower f1">🌷</div>
  <div class="flower f2">🌼</div>
  <div class="flower f3">🌸</div>
  <div class="flower f4">🌷</div>

  <div class="park-caption">
    <p>Masalımız burada devam ediyor...</p>
    <button onclick="nextScene(3)">
      Salıncağa gidelim → 
    </button>
  </div>

</section>


<!-- 3. SALINCAK -->

<section class="scene" id="scene3">

  <h1>Hadi biraz salıncakta sallanalım! 🎀</h1>

  <div class="swing">
    <div class="top"></div>
    <div class="rope r1"></div>
    <div class="rope r2"></div>
    <div class="seat"></div>
  </div>

  <p>Seninle her yer güzel. 💗</p>

  <button onclick="nextScene(1)">
    Baştan başla ↻
  </button>

</section>


<script>
function nextScene(number) {
  document.querySelectorAll(".scene").forEach(scene => {
    scene.classList.remove("active");
  });

  document.getElementById("scene" + number).classList.add("active");
}
</script>

</body>
</html>
