
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sirius ✨</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(ellipse at bottom, #18213d 0%, #080b19 65%, #02030a 100%);
  color: white;
  font-family: Georgia, serif;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
.content {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
}
h1 {
  font-size: clamp(32px, 8vw, 55px);
  color: #dce7ff;
  text-shadow: 0 0 22px #9bbaff;
  animation: glow 2s infinite alternate;
}
.heart {
  font-size: clamp(85px, 22vw, 150px);
  color: #ff9dbd;
  text-shadow: 0 0 20px #ff6dba, 0 0 50px #e84eaa;
  animation: beat 1.5s infinite;
  line-height: 1.3;
}
p {
  max-width: 430px;
  font-size: clamp(19px, 5vw, 25px);
  line-height: 1.6;
  color: #fff0f6;
  text-shadow: 0 0 12px #ff8ec4;
}
.small { color: #b9caff; font-size: 16px; letter-spacing: 5px; }
@keyframes beat {
  50% { transform: scale(1.12); }
}
@keyframes glow {
  to { text-shadow: 0 0 35px #a9c8ff, 0 0 60px #799fff; }
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="content">
  <div class="small">✦ SANA ÖZEL ✦</div>
  <h1>Sirius</h1>
  <div class="heart">♥</div>
  <p>Senden başka kimseyi sevemem.<br>
  Seni rengârenk acıların ile seviyorum.</p>
  <div class="small">✧ EN PARLAK YILDIZIM ✧</div>
</div>
<script>
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
let stars = [];
function resize() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  stars = Array.from({length:150}, () => ({
    x: Math.random()*innerWidth,
    y: Math.random()*innerHeight,
    r: Math.random()*1.8+.3,
    a: Math.random(),
    s: Math.random()*.018+.004
  }));
}
function draw() {
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for (const star of stars) {
    star.a += star.s;
    const opacity = .35 + Math.abs(Math.sin(star.a))*.65;
    ctx.beginPath();
    ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(220,230,255,${opacity})`;
    ctx.shadowBlur = 9;
    ctx.shadowColor = "#a9caff";
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  requestAnimationFrame(draw);
}
addEventListener("resize",resize);
resize();
draw();
</script>
</body>
</html>
